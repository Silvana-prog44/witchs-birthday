<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witch's Birthday</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 5%,#330b19,#09070b 45%,#020204);color:#eee;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}#stars{position:fixed;inset:0;pointer-events:none;z-index:5}.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 8px 3px #fff,0 0 18px 5px #d9d9e8;animation:blink 1s infinite alternate}@keyframes blink{to{opacity:.15;transform:scale(.35)}}
#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#2b0b16,#050507 70%);display:grid;place-items:center;transition:opacity 1.2s,visibility 1.2s}#intro.hide{opacity:0;visibility:hidden}.introcat{position:relative;width:170px;height:220px;animation:float 2s infinite alternate}@keyframes float{to{transform:translateY(-12px)}}
.head{position:absolute;left:42px;top:45px;width:86px;height:76px;border-radius:50%;background:#f5f5f6;box-shadow:0 0 30px #fff5}.ear{position:absolute;top:22px;width:48px;height:60px;background:#f5f5f6}.ear.l{left:32px;transform:rotate(-18deg);clip-path:polygon(0 100%,15% 0,100% 78%)}.ear.r{right:32px;transform:rotate(18deg);clip-path:polygon(0 78%,85% 0,100% 100%)}.bodycat{position:absolute;left:51px;top:111px;width:69px;height:91px;border-radius:50% 50% 25% 25%;background:#eee}.eye{position:absolute;top:78px;width:13px;height:17px;border-radius:50%;background:#f0143d;box-shadow:0 0 15px 4px #f0143d}.e1{left:65px}.e2{left:96px}.tail{position:absolute;left:104px;top:126px;width:72px;height:77px;border:10px solid #eee;border-left:0;border-bottom:0;border-radius:0 70px 0 0;animation:wag 1s infinite alternate;transform-origin:left bottom}@keyframes wag{to{transform:rotate(15deg)}}.introtext{position:absolute;bottom:12%;letter-spacing:5px;font-size:11px;color:#c7c2cc}
main{min-height:100vh;padding:22px 14px 75px}.moonarea{height:195px;position:relative;display:flex;justify-content:center}.moon{position:absolute;top:0;width:150px;height:150px;border-radius:50%;background:#010103;border:2px solid #777;box-shadow:0 0 28px #fff2}.moon:after{content:'';position:absolute;left:42px;top:-10px;width:140px;height:140px;border-radius:50%;background:#0b080d}.mooncat{position:absolute;top:17px;left:50%;width:115px;height:125px;transform:translateX(-50%);z-index:2}.mooncat .head{left:29px;top:22px;width:57px;height:52px}.mooncat .ear{top:7px;width:32px;height:40px}.mooncat .ear.l{left:20px}.mooncat .ear.r{right:20px}.mooncat .bodycat{left:37px;top:69px;width:45px;height:51px}.mooncat .eye{top:41px;width:8px;height:11px}.mooncat .e1{left:41px}.mooncat .e2{left:63px}.mooncat .tail{left:68px;top:72px;width:52px;height:49px;border-width:8px}
.altar{position:relative;max-width:650px;margin:auto;padding:25px 13px 42px;border-radius:25px;background:linear-gradient(145deg,#0b080d,#180910 55%,#050507);box-shadow:0 25px 70px #000,inset 0 0 55px #000}.orn{position:absolute;color:#9b1d3a;font-size:31px;opacity:.8}.o1{left:12px;top:180px}.o2{right:12px;top:270px}.o3{left:32px;bottom:130px}.o4{right:32px;bottom:80px}
.card{position:relative;max-width:500px;margin:auto;padding:38px 24px 40px;border:1px solid #ccc3;border-radius:15px;background:#0d0b10ee;box-shadow:0 20px 45px #000,inset 0 0 30px #fff1}.card:before{content:'';position:absolute;inset:9px;border:1px solid #8e183155;border-radius:10px}h1{position:relative;text-align:center;font-size:clamp(32px,8vw,55px);font-weight:400;letter-spacing:4px;margin:0 0 14px;text-shadow:0 0 18px #fff3}.rule{text-align:center;letter-spacing:6px;color:#c5c0ca;margin:12px}.row{position:relative;text-align:center;font-size:15px;letter-spacing:2px;margin:14px;color:#d8d4da}.row small{display:block;font-size:10px;letter-spacing:3px;color:#88838d;margin-bottom:4px;text-transform:uppercase}.invite{position:relative;text-align:center;font-style:italic;letter-spacing:1px;margin-top:25px}
.candles{height:305px;display:flex;align-items:flex-end;justify-content:space-around;gap:2px;margin-top:12px}.candle{position:relative;width:24px;border-radius:5px 5px 3px 3px;background:linear-gradient(90deg,#4b101c,#96283d,#4d101d);box-shadow:0 0 15px #8d18304d}.candle:nth-child(1){height:112px}.candle:nth-child(2){height:72px}.candle:nth-child(3){height:150px}.candle:nth-child(4){height:90px}.candle:nth-child(5){height:176px}.candle:nth-child(6){height:116px}.candle:nth-child(7){height:76px}.candle:nth-child(8){height:140px}.candle:nth-child(9){height:102px}.candle:nth-child(10){height:160px}.candle:nth-child(11){height:86px}.candle:nth-child(12){height:130px}.candle:before{content:'';position:absolute;left:50%;top:-23px;width:10px;height:25px;transform:translateX(-50%);border-radius:50%;background:#fff;box-shadow:0 0 16px 6px #fff,0 0 30px 9px #a31b35;animation:flame .5s infinite alternate}.candle:after{content:'';position:absolute;left:-5px;right:-5px;top:18%;height:58%;background:radial-gradient(ellipse at 20% 0,#bd5265 0 8%,transparent 9%),radial-gradient(ellipse at 80% 8%,#a4384e 0 8%,transparent 9%)}@keyframes flame{to{transform:translateX(-50%) scale(1.2) rotate(4deg);opacity:.7}.note{text-align:center;color:#77727d;font-size:10px;letter-spacing:2px;margin-top:18px}
@media(max-width:420px){.candle{width:19px}.card{padding:32px 15px 38px}}
</style></head><body><div id="stars"></div>
<section id="intro"><div class="introcat"><span class="ear l"></span><span class="ear r"></span><span class="head"></span><span class="bodycat"></span><span class="tail"></span><span class="eye e1"></span><span class="eye e2"></span></div><div class="introtext">a little magic is coming...</div></section>
<main><div class="moonarea"><div class="moon"></div><div class="mooncat"><span class="ear l"></span><span class="ear r"></span><span class="head"></span><span class="bodycat"></span><span class="tail"></span><span class="eye e1"></span><span class="eye e2"></span></div></div><section class="altar"><span class="orn o1">✦</span><span class="orn o2">☾</span><span class="orn o3">❦</span><span class="orn o4">✧</span><article class="card"><h1>Witch's Birthday</h1><div class="rule">✦ ───── ☾ ───── ✦</div><div class="row"><small>Date</small>3rd Mehr · 25th September</div><div class="row"><small>Day</small>Friday</div><div class="row"><small>Time</small>2:00 PM</div><div class="row"><small>Place</small>Witch's House</div><div class="invite">congrats darling, you're invited to my party</div></article><div class="candles">''' + ''.join('<div class="candle"></div>' for _ in range(12)) + r'''</div><div class="note">✦ a little chaos, a little magic ✦</div></section></main>
<script>const s=document.getElementById('stars');for(let i=0;i<240;i++){let x=document.createElement('i');x.className='star';x.style.left=Math.random()*100+'%';x.style.top=Math.random()*100+'%';let z=2+Math.random()*4;x.style.width=z+'px';x.style.height=z+'px';x.style.animationDelay=Math.random()*2.5+'s';x.style.animationDuration=.6+Math.random()*1.8+'s';s.appendChild(x)}setTimeout(()=>document.getElementById('intro').classList.add('hide'),2800)</script></body></html>
