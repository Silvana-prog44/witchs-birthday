<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Witch's Birthday</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030305;color:#eee;font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden;background:radial-gradient(circle at 50% 20%,#240006 0,#090205 35%,#020204 75%)}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 7px 2px #fff,0 0 18px 5px #d9d9e8;animation:twinkle 1.1s infinite alternate}
.star::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:#fff;text-shadow:0 0 12px #fff;opacity:.8}
@keyframes twinkle{0%{opacity:.18;transform:scale(.65) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(18deg)}100%{opacity:.35;transform:scale(.8) rotate(36deg)}}
.wrap{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;z-index:2}
.scene{width:min(480px,94vw);perspective:1200px;position:relative}
.envelope{height:680px;position:relative;transition:1.1s;transform-style:preserve-3d}
.front{position:absolute;inset:0;border:1px solid #6e0914;border-radius:20px;background:linear-gradient(145deg,#150307,#050506);box-shadow:0 0 60px #8e071933, inset 0 0 35px #9d0a1630;display:grid;place-items:center;z-index:3;backface-visibility:hidden}
.moon{position:absolute;top:70px;right:55px;width:105px;height:105px;border-radius:50%;background:#dddde4;box-shadow:0 0 30px #fff8;overflow:hidden}
.moon:after{content:"";position:absolute;width:110px;height:110px;left:27px;top:-8px;border-radius:50%;background:#090609}
.flap{position:absolute;top:0;left:0;right:0;height:250px;background:linear-gradient(135deg,#32030b,#100107);clip-path:polygon(0 0,100% 0,50% 100%);z-index:4;filter:drop-shadow(0 10px 12px #000)}
.seal{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#8d0b18;border:2px solid #d7bfc4;box-shadow:0 0 24px #c50e2b99;display:grid;place-items:center;font-size:30px;z-index:5}
.front h1{position:absolute;bottom:125px;margin:0;text-align:center;font-size:34px;letter-spacing:4px;color:#eee;text-shadow:0 0 16px #d00}
.front p{position:absolute;bottom:78px;margin:0;color:#aaa;font-size:12px;letter-spacing:3px}
.card{position:absolute;inset:18px;border-radius:16px;border:1px solid #777;background:linear-gradient(150deg,#0c0c10,#170208 60%,#050506);padding:42px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 50px #c10b2440;opacity:0;transform:translateY(40px) scale(.95);transition:1s;pointer-events:none}
.open .front{transform:rotateX(100deg) translateY(-90px);opacity:0}
.open .card{opacity:1;transform:none;pointer-events:auto}
.kicker{font-size:11px;letter-spacing:5px;color:#c6c6cd;text-transform:uppercase}
h2{font-size:39px;letter-spacing:5px;margin:12px 0 7px;color:#fff;text-shadow:0 0 22px #e10c2d}
.line{width:150px;height:1px;background:linear-gradient(90deg,transparent,#d9d9df,transparent);margin:10px}
.invite{font-size:20px;font-style:italic;margin:18px 0 28px;color:#eee}
.details{width:100%;display:grid;gap:13px;margin-bottom:20px}
.detail{border:1px solid #4d4d54;border-radius:10px;padding:11px;background:#ffffff05}
.label{font-size:9px;letter-spacing:3px;color:#aaa;text-transform:uppercase}.value{font-size:16px;margin-top:4px;color:#fff}
button{border:1px solid #aaa;background:#09090b;color:#fff;border-radius:30px;padding:12px 25px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 20px #ddd2}
button:hover{background:#21040a;box-shadow:0 0 28px #d10b2e88}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:#999}
.ring{position:absolute;width:180px;height:180px;border:1px solid #d0d0d555;border-radius:50%;animation:pulse 4s infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.25);opacity:.1}}
@media(max-width:430px){.envelope{height:590px}.front h1{font-size:28px}.card{padding:30px 20px}h2{font-size:31px}}

.black-moon{
  top:34px;left:50%;right:auto;width:128px;height:128px;
  transform:translateX(-50%);background:#050507;
  border:2px solid #cfcfd7;box-shadow:0 0 22px #fff7,0 0 55px #bdbdca44;
  overflow:visible;
}
.black-moon:after{
  content:"";position:absolute;width:112px;height:112px;left:31px;top:-7px;
  border-radius:50%;background:#030305;
}
.black-moon:before{
  content:"";position:absolute;left:22px;bottom:-8px;width:86px;height:14px;
  border-radius:50%;background:#030305;filter:blur(5px);opacity:.9;
}
.cat{position:absolute;z-index:6;top:66px;left:50%;width:112px;height:115px;transform:translateX(-50%);filter:drop-shadow(0 0 8px #fff8)}
.cat .head{position:absolute;left:28px;top:22px;width:56px;height:50px;border-radius:48% 48% 45% 45%;background:#f5f5f7}
.cat .ear{position:absolute;top:5px;width:29px;height:37px;background:#f5f5f7}
.cat .e1{left:25px;transform:rotate(-20deg);clip-path:polygon(0 100%,15% 0,100% 80%)}
.cat .e2{right:25px;transform:rotate(20deg);clip-path:polygon(0 80%,85% 0,100% 100%)}
.cat .body{position:absolute;left:34px;top:66px;width:47px;height:46px;border-radius:50% 50% 30% 30%;background:#f5f5f7}
.cat .tail{position:absolute;left:72px;top:67px;width:47px;height:50px;border:8px solid #f5f5f7;border-left:0;border-bottom:0;border-radius:0 42px 0 0;transform:rotate(8deg)}
.cat .eye{position:absolute;z-index:2;top:41px;width:8px;height:11px;border-radius:50%;background:#e5002b;box-shadow:0 0 10px 3px #e5002b}
.cat .eye1{left:42px}.cat .eye2{left:64px}
.candles{position:absolute;z-index:7;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:18px;pointer-events:none}
.candle{position:relative;width:17px;height:62px;border-radius:4px 4px 2px 2px;background:linear-gradient(90deg,#8b8b93,#f3f3f5,#777780);box-shadow:0 0 15px #fff5}
.candle.c2{height:82px}.candle.c3{height:52px}
.candle i{position:absolute;left:50%;top:-20px;width:9px;height:22px;transform:translateX(-50%);border-radius:50% 50% 45% 45%;background:#fff;box-shadow:0 0 14px 5px #d8d8e2;animation:flame .45s infinite alternate}
.candle i:after{content:"";position:absolute;left:3px;top:8px;width:3px;height:8px;border-radius:50%;background:#777}
@keyframes flame{to{transform:translateX(-50%) scale(1.18) rotate(3deg);opacity:.8}}

</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap"><div class="scene"><div class="envelope" id="env">
  <div class="front">
    <div class="moon black-moon"></div>
    <div class="cat" aria-hidden="true"><span class="ear e1"></span><span class="ear e2"></span><span class="head"></span><span class="body"></span><span class="tail"></span><span class="eye eye1"></span><span class="eye eye2"></span></div>
    <div class="ring"></div>
    <div class="flap"></div><div class="seal">☾</div>
    <h1>WITCH'S BIRTHDAY</h1><p>CLICK TO OPEN</p>
  </div>
  <div class="candles" aria-hidden="true">
    <div class="candle c1"><i></i></div><div class="candle c2"><i></i></div><div class="candle c3"><i></i></div>
  </div>
  <div class="card">
    <div class="kicker">an invitation under the moon</div>
    <h2>WITCH'S BIRTHDAY</h2><div class="line"></div>
    <div class="invite">congrats darling, you're invited to my party</div>
    <div class="details">
      <div class="detail"><div class="label">Date</div><div class="value">Friday · 25th September</div></div>
      <div class="detail"><div class="label">Time</div><div class="value">2:00 PM</div></div>
      <div class="detail"><div class="label">Place</div><div class="value">Witch's House</div></div>
    </div>
    <button id="music">☾ PLAY MAGICAL MUSIC</button>
    <div style="font-size:9px;letter-spacing:1.5px;color:#888;margin-top:10px">original enchanted ambient · no external audio</div>
  </div>
</div></div></div>
<div id="hint">tap the seal to enter ✦</div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<180;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';let z=2+Math.random()*4;s.style.width=z+'px';s.style.height=z+'px';s.style.animationDelay=(Math.random()*2.5)+'s';s.style.animationDuration=(.7+Math.random()*1.8)+'s';s.style.opacity=.25+Math.random()*.75;stars.appendChild(s)}
const env=document.getElementById('env'); const hint=document.getElementById('hint');
let opened=false, ctx, master, timer;
env.querySelector('.front').onclick=()=>{opened=true;env.classList.add('open');hint.textContent='the night is yours ✦';startMusic();};

function startMusic(){
 if(ctx)return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();master.gain.value=.035;master.connect(ctx.destination);
 const notes=[55,65.41,73.42,82.41,98,82.41,73.42,65.41,49,58.27,69.30,73.42];
 let step=0;
 function note(freq,dur,type,gain,delay=0){
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type=type;o.frequency.value=freq;
   const t=ctx.currentTime+delay;
   g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(gain,t+.08);
   g.gain.exponentialRampToValueAtTime(.0001,t+dur);
   o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
 }
 function pulse(){
   const root=notes[step++%notes.length];
   note(root,2.4,'sine',.16);
   note(root*2,1.5,'triangle',.045,.05);
   if(step%4===0) note(root*3,2.8,'sine',.025,.18);
   timer=setTimeout(pulse,720);
 }
 pulse();
}
document.getElementById('music').onclick=(e)=>{e.stopPropagation(); if(!ctx)startMusic(); else if(ctx.state==='running')ctx.suspend(); else ctx.resume();};
</script>
</body>
</html>
